[project]
name = "tsinfer-perf-benchmark"
version = "0.0.0"
description = "Repeated inference performance benchmarks for tsinfer"
requires-python = ">=3.11"
dependencies = [
    "click",
    "numpy>=2",
    "numba",
    "tqdm",
    "tskit>=1.0.0",
    "zarr<3",
    "bio2zarr",
    "pandas",
    "msprime>=1.4.2",
    "stdpopsim>=0.3.0",
    "sgkit==0.10.0",
    "snakemake",
    "pyyaml",
    "xarray",
    "pytest",
    "six>=1.17.0",
    "humanize>=4.16.0",
    "daiquiri>=3.4.0",
    "lmdb>=2.3.0",
    "sortedcontainers>=2.4.0",
    "attrs>=19.2.0",
    "psutil>=5.9.0",
]

[dependency-groups]
lint = [
    "prek==0.3.3",
    "ruff==0.15.1",
]
[tool.uv]
package = false
default-groups = ["lint"]

[tool.ruff]
target-version = "py311"
line-length = 89

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
